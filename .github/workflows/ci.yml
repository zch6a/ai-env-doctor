name: CI
on: [push, pull_request]
# Read-only: tests need no write access.
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions pinned to commits; the token is not left in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; it has no moving major tag
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - run: uv pip install -e . pytest ruff
      - run: uv run --no-project pytest -q
      - run: uv run --no-project ruff check src tests
      # The doctor on the runner itself (no GPU there): it must run and report, whatever it finds.
      - run: uv run --no-project ai-env-doctor --offline --lang en || true
