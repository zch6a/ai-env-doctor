[project]
name = "ai-env-doctor"
version = "0.1.0"
description = "One command to find out why PyTorch does not use your GPU, what is wrong with CUDA, drivers, proxies and mirrors, and which local models this machine can run. Read-only, no dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["cuda", "pytorch", "gpu", "nvidia", "diagnostics", "doctor", "llm", "ollama", "proxy", "huggingface", "mps", "troubleshooting"]

[project.urls]
Homepage = "https://github.com/zch6a/ai-env-doctor"
Issues = "https://github.com/zch6a/ai-env-doctor/issues"

[project.scripts]
ai-env-doctor = "ai_env_doctor.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_env_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["ai_env_doctor"]
